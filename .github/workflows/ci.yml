name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 and tree-sitter are native; --frozen-lockfile keeps CI
      # honest about the committed lockfile.
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Self-checks
        run: pnpm check

      - name: Design guides
        run: node scripts/check-design.mjs
