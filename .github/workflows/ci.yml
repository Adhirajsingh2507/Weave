name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 and tree-sitter are native; --frozen-lockfile keeps CI
      # honest about the committed lockfile.
      - run: pnpm install --frozen-lockfile

      # D2: the machine every push is proven on has the demo's tools, so no check can pass by
      # printing "NOT verified here" (WEAVE_REQUIRE_TOOLS=1 turns that into a failure).
      # Ubuntu 24.04 restricts unprivileged user namespaces; bubblewrap needs them.
      - name: Tools (bubblewrap, Playwright Chromium, gitleaks)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pnpm exec playwright install --with-deps chromium
          pnpm tools:gitleaks

      - name: Build
        run: pnpm build

      - name: Self-checks
        run: pnpm check
        env:
          WEAVE_REQUIRE_TOOLS: "1"

      - name: Design guides
        run: node scripts/check-design.mjs
